<!doctype html><html><head><meta charset="utf-8"><title>Art preview</title></head>
<body style="background:#e8d8b8;margin:0;padding:10px">
<div id="out"></div>
<script type="module">
import { renderFrame, basePose } from './src/art/characterArt.ts';
import { renderEnemyFrame } from './src/art/enemyArt.ts';
import { ENEMIES } from './src/data/enemies.ts';
const out = document.getElementById('out');
const ids = ['mametchi','memetchi','kuchipatchi','mimitchi','violetchi','gozarutchi','maskutchi','oyajitchi'];
const poses = [{facing:'front'},{facing:'side'},{facing:'back'},{facing:'side',hammer:0.35,lean:7,expr:'angry'},{facing:'front',expr:'happy',armL:2.6,armR:-2.6},{facing:'front',expr:'sad'},{facing:'front',expr:'surprised'},{facing:'side',expr:'hurt'},{facing:'side', footL:-14, footR:12, liftR:8, bob:5, lean:5, armL:1, armR:-1, expr:'determined'}];
for (const id of ids) { const row=document.createElement('div'); for (const p of poses) row.appendChild(renderFrame({charId:id}, basePose(p), id+JSON.stringify(p))); out.appendChild(row); }
const sp=['furawatchi','youngmametchi','youngmimitchi','ringotchi','nikatchi','ichigotchi','drotchi','tarakotchi','hashizotchi','hinotamatchi','debatchi','robotchi','wooltchi','eternatchi','young_eter','dahui','xiaohui','lumi'];
const row=document.createElement('div'); for (const s of sp) row.appendChild(renderFrame({npc:{species:s,color:'#fff',accent:'#000'}}, basePose({}), s)); out.appendChild(row);
const rowd=document.createElement('div'); rowd.appendChild(renderFrame({npc:{species:'eternatchi',color:'#fff',accent:'#000'},dark:true}, basePose({expr:'angry'}), 'sh')); rowd.appendChild(renderFrame({charId:'mametchi',dark:true}, basePose({expr:'angry'}), 'dm')); for (const s of sp.slice(0,6)) rowd.appendChild(renderFrame({npc:{species:s,color:'#fff',accent:'#000'}}, basePose({facing:'side'}), s+'side')); out.appendChild(rowd);
const row3=document.createElement('div'); for (const [id,e] of Object.entries(ENEMIES)) { const c=renderEnemyFrame(e.art,'idle0',e.traits.includes('spiky'),id); c.style.width='96px'; row3.appendChild(c);} out.appendChild(row3);
</script></body></html>
